<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="flash {{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="email" name="email" placeholder="Enter email id" required>
            <input type="text" name="Full Name" placeholder="Enter your name" required>
            <input type="text" name="Address" placeholder="Enter Address" required>
            <input type="text" name="Pin Code" placeholder="Enter Pin Code" required>
            <input type="text" name="Car Number" placeholder="Enter No. of car" required>
            <input type="password" name="password" placeholder="Enter a Password" required>
            
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</body>
</html>
