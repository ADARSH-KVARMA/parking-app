<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" xintegrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='all_users_info.css') }}">    
</head>
<body>
    <div class="navbar">
        <div class="left">Welcome to Admin</div>
        <div class="center">
            <a href="/">Home</a> |
            <a href="/admin/users">Users</a> |
            <a href="/admin/user_summary">Summary</a> |
            <a href="/logout">Logout</a>
        </div>
        <div class="right"><a href="#">Edit Profile</a></div>
    </div>

    <h2 class="dashboard-heading">User Information Dashboard</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Pin Code</th>
                    <th>Car No.</th>
                </tr>
            </thead>
            <tbody>
                {% for user in user_data %}
                <tr>
                    <td>{{ user[0] }}</td>
                    <td>{{ user[1] }}</td>
                    <td>{{ user[2] }}</td>
                    <td>{{ user[3] }}</td>
                    <td>{{ user[4] }}</td>
                </tr>
                {% endfor %}

                {% if not user_data %}
                <tr>
                    <td colspan="5" class="py-4 px-6 text-center text-gray-500">No user data available.</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>
